<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Unavailable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F2F2F3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: left;
            max-width: 280px;
        }
        .logo {
            width: 36px;
            height: auto;
            margin-bottom: 18px;
        }
        h1 {
            font-size: 25px;
            font-weight: 600;
            line-height: 30px;
            margin-bottom: 16px;
            color: #2E2E2E;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #6B6B6B;
        }
        .status {
            margin-top: 12px;
            font-size: 14px;
            padding: 7px;
            background: #fff2e5;            
            border: 1px solid orange;
            border-radius: 4px;
            color: #000;
        }
        .text {
            display: flex;
            flex-direction:  column;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo_down.svg" alt="MagicPost" class="logo">
        <h1>We're having technical difficulties</h1>
        <div class="text">
        <p>Our team is working to have things running smoothly again soon.</p>
        <p>Please try again in a few moments.</p>
        <p class="status">We have identified the issue with our hosting provider (AWS) and are working to restore full functionality.</p>
    </div>
    </div>
</body>
</html>
